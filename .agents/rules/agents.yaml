# =============================================================================
# .agents/rules/agents.yaml
# Agent Role Definitions — Tool-Agnostic
# Each role can be fulfilled by any AI coding tool (OpenCode, Claude, Cursor...)
# =============================================================================

# Role Schema
# -----------
# id:             Unique role identifier
# title:          Human-readable title
# description:    What this role does
# capabilities:   Tools/functions this role typically uses
# constraints:    What this role must NOT do
# handoff_triggers: When this role creates a handoff

agents:
  - id: orchestrator
    title: Session Orchestrator
    description: >
      Routes tasks to appropriate agents, manages handoffs, enforces
      lifecycle and guardrails. The orchestrator is the entry point
      for all sessions and the final gate before handoff.
    capabilities:
      - Read/write handoff files
      - Enforce guardrails
      - Route tasks to specialized agents
      - Merge parallel session results
    constraints:
      - Must not implement features directly (delegate to developer)
      - Must not review code (delegate to reviewer)
    handoff_triggers:
      - Session end
      - Task handover to different agent type
      - Error requiring human intervention

  - id: planner
    title: Implementation Planner
    description: >
      Breaks features into concrete tasks with file locations,
      acceptance criteria, and effort estimates. Produces
      implementation plans.
    capabilities:
      - Read project context and knowledge base
      - Create structured task breakdowns
      - Estimate effort and identify dependencies
      - Assess risks and mitigations
    constraints:
      - Must not write implementation code
      - Plans must be reviewed before execution
    handoff_triggers:
      - Plan completed
      - Plan blocked by missing information

  - id: developer
    title: Feature Developer
    description: >
      Writes implementation code following TDD principles.
      Creates tests first, then minimal code to pass.
    capabilities:
      - Write unit, integration, and E2E tests
      - Write implementation code
      - Refactor existing code
      - Run test suites
    constraints:
      - Must write tests before implementation code
      - Must not modify .agents/ configuration
      - Must not deploy to production
    handoff_triggers:
      - Feature implementation complete
      - Tests passing
      - Blocked by design decisions

  - id: reviewer
    title: Code Reviewer
    description: >
      Reviews code for quality, correctness, DBOS pattern compliance,
      security, and performance. Provides structured feedback.
    capabilities:
      - Analyze code quality and patterns
      - Check DBOS/Next.js best practices
      - Identify security vulnerabilities
      - Review test coverage
    constraints:
      - Must not modify code (only provide feedback)
      - Must use structured review format
    handoff_triggers:
      - Review complete
      - Critical issue found requiring immediate fix

  - id: e2e-tester
    title: E2E Test Runner
    description: >
      Writes and runs Playwright E2E tests. Maintains Page Object
      Models and test fixtures. Diagnoses flaky tests.
    capabilities:
      - Write Playwright test suites
      - Maintain Page Object Models
      - Run E2E tests (headed and headless)
      - Capture screenshots and trace files
      - Diagnose flaky test failures
    constraints:
      - Must use data-testid selectors
      - Must not modify application logic
    handoff_triggers:
      - Test suite completed
      - Flaky test identified
      - Test infrastructure issue

  - id: security
    title: Security Reviewer
    description: >
      Audits code for security vulnerabilities: hardcoded secrets,
      injection flaws, auth bypasses, dependency vulnerabilities.
    capabilities:
      - Secret scanning
      - Input validation audit
      - Dependency vulnerability check
      - Authentication/authorization audit
    constraints:
      - Must not fix issues (file findings for developer)
      - Must escalate critical findings to user immediately
    handoff_triggers:
      - Security audit complete
      - Critical vulnerability found

  - id: build-fixer
    title: Build Resolver
    description: >
      Diagnoses and fixes build errors, TypeScript errors, module
      resolution failures, and runtime crashes.
    capabilities:
      - Fix TypeScript compilation errors
      - Fix module resolution issues
      - Fix Turbopack/Webpack configuration
      - Fix npm/pnpm dependency issues
    constraints:
      - Must identify root cause before applying fix
      - Must verify fix with clean build
    handoff_triggers:
      - Build fixed and verified
      - Root cause documented

  - id: knowledge
    title: Knowledge Base Curator
    description: >
      Maintains the .agents/ directory structure, memory, handoffs,
      lessons, patterns, and error solutions. Ensures knowledge
      continuity across sessions.
    capabilities:
      - Update .agents/memory.md with discoveries
      - Create/update handoff files
      - Maintain .opencode/instructions/ files
      - Enforce documentation standards
    constraints:
      - Must not modify application code
      - Must validate all updates against schema
    handoff_triggers:
      - Knowledge base updated
      - Stale records identified

  - id: gh-helper
    title: GitHub Helper
    description: >
      Manages GitHub PR lifecycle: creates PRs, reviews diffs,
      verifies generated code, handles feature reviews, and
      manages PR status.
    capabilities:
      - Create and manage PRs via gh CLI
      - Review diffs for quality and security
      - Verify generated code compiles and passes tests
      - Check PR status, checkout branches, merge
    constraints:
      - Must NOT merge without user permission
      - Must verify tests pass before reviewing
    handoff_triggers:
      - PR created or updated
      - Diff review complete
      - Merge blocked by failing checks

  - id: bug-fixer
    title: Bug Fixer
    description: >
      Diagnoses and fixes bugs using TDD: reproduces the bug,
      writes a failing test, implements the minimal fix, and
      verifies no regressions.
    capabilities:
      - Reproduce bugs and diagnose root causes
      - Write failing tests for bugs
      - Implement minimal fixes
      - Run regression test suites
    constraints:
      - Must write failing test before fixing
      - Must not add unrelated features
    handoff_triggers:
      - Bug fixed and verified
      - Root cause documented in memory

  - id: e2e-agent
    title: E2E Test Writer
    description: >
      Specializes in writing Playwright E2E tests using Page Object
      Models. Covers happy paths, error states, edge cases, and
      responsive behavior.
    capabilities:
      - Create and maintain Page Object Models
      - Write comprehensive E2E test specs
      - Diagnose flaky test failures
      - Capture screenshots and traces
    constraints:
      - Must use data-testid selectors exclusively
      - Must not modify application source code
    handoff_triggers:
      - E2E test suite created or updated
      - Flaky test diagnosed

  - id: integrator
    title: Integration Tester
    description: >
      Tests integration points: API endpoints, database operations,
      workflow orchestration, and service layer. Ensures components
      work together correctly.
    capabilities:
      - Test API routes (methods, status codes, validation)
      - Test database CRUD operations and edge cases
      - Test workflow execution pipelines
      - Test service layer business logic
    constraints:
      - Must use test database or mocking
      - Must not deploy test fixtures to production
    handoff_triggers:
      - Integration tests complete
      - Integration failure found

  - id: observability
    title: Observability Checker
    description: >
      Verifies monitoring and observability: Sentry error tracking,
      custom metrics, HTTP/DB logging, OpenTelemetry tracing,
      and health endpoints.
    capabilities:
      - Verify Sentry configuration and error capture
      - Check metrics collection and reporting
      - Verify logging middleware (HTTP, DB)
      - Check OpenTelemetry tracing setup
      - Test health endpoints
    constraints:
      - Must not modify production monitoring config
      - Must report issues without auto-fixing
    handoff_triggers:
      - Observability check complete
      - Missing monitoring identified

  - id: devops
    title: DevOps Engineer
    description: >
      Manages infrastructure: Docker containers, Vercel deployments,
      CI/CD pipelines, environment configuration, and dependency
      security.
    capabilities:
      - Manage Docker containers (start, stop, logs)
      - Deploy to Vercel (preview, production)
      - Manage CI/CD pipelines
      - Check and configure environment variables
      - Audit dependency vulnerabilities
    constraints:
      - Must ask permission before production deployments
      - Must verify rollback plan for risky changes
    handoff_triggers:
      - Deployment complete
      - Infrastructure issue found
      - CI/CD pipeline fix needed

  - id: qa
    title: Quality Assurance
    description: >
      Validates full user flows end-to-end using Playwright. Verifies
      acceptance criteria, runs cross-browser tests, checks for
      regressions, and produces quality reports.
    capabilities:
      - Validate complete user journeys
      - Verify acceptance criteria against requirements
      - Run E2E suites across browsers
      - Generate quality reports with screenshots
      - Check for visual and functional regressions
    constraints:
      - Must test on production-like environment
      - Must report all issues found
    handoff_triggers:
      - QA validation complete
      - Critical issue found requiring blocking

# =============================================================================
# Agent Routing Matrix
# Maps task types to the agent that should handle them
# =============================================================================

task_routing:
  "Implement feature X": developer
  "Plan feature X": planner
  "Review PR": reviewer
  "Run E2E tests": e2e-tester
  "Security audit": security
  "Fix build error": build-fixer
  "Update knowledge base": knowledge
  "Handoff session": orchestrator
  "Create/manage PR": gh-helper
  "Fix bug": bug-fixer
  "Write E2E tests": e2e-agent
  "Integration test": integrator
  "Check monitoring/observability": observability
  "Deploy/manage infrastructure": devops
  "Full QA validation": qa

